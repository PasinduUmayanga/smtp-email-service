version: 1.0.{build}

image: Visual Studio 2022

build: off
test: off

environment:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_ROOT: '%APPVEYOR_BUILD_FOLDER%\.dotnet'
  MSBuildSDKsPath: '%APPVEYOR_BUILD_FOLDER%\.dotnet\sdk\10.0.400\Sdks'
  NUGET_PACKAGES: '%USERPROFILE%\.nuget\packages'

cache:
  - '%NUGET_PACKAGES%'
  - '%LOCALAPPDATA%\NuGet\v3-cache'
  - '.dotnet -> global.json'

install:
  - ps: |
      $dotnetDirectory = Join-Path $env:APPVEYOR_BUILD_FOLDER '.dotnet'
      $dotnetExecutable = Join-Path $dotnetDirectory 'dotnet.exe'
      $sdkVersion = '10.0.400'
      $sdkIsValid = $false
      if (Test-Path -LiteralPath $dotnetExecutable) {
        $installedVersion = & $dotnetExecutable --version
        $sdkIsValid = $LASTEXITCODE -eq 0 -and $installedVersion -eq $sdkVersion
      }
      if (-not $sdkIsValid) {
        if (Test-Path -LiteralPath $dotnetDirectory) {
          Remove-Item -LiteralPath $dotnetDirectory -Recurse -Force
        }
        Invoke-WebRequest 'https://dot.net/v1/dotnet-install.ps1' -OutFile dotnet-install.ps1
        & .\dotnet-install.ps1 -Version $sdkVersion -InstallDir $dotnetDirectory -NoPath
      }
      & $dotnetExecutable --info

before_build:
  - ps: & .\.dotnet\dotnet.exe restore SmtpEmailService.sln

build_script:
  - ps: & .\.dotnet\dotnet.exe build SmtpEmailService.sln --configuration Release --no-restore

test_script:
  - ps: & .\.dotnet\dotnet.exe test SmtpEmailService.sln --configuration Release --no-build --no-restore --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

after_test:
  - ps: Get-ChildItem -Path TestResults -Filter *.trx -Recurse | ForEach-Object { Push-AppveyorArtifact $_.FullName -FileName $_.Name }

artifacts:
  - path: TestResults\*.trx
    name: TestResults
