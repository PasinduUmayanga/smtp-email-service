version: 1.0.{build}

image: Visual Studio 2022

environment:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_PACKAGES: '%USERPROFILE%\.nuget\packages'

cache:
  - '%NUGET_PACKAGES% -> **\*.csproj, Directory.Build.props, global.json, NuGet.Config'
  - '%LOCALAPPDATA%\NuGet\v3-cache -> **\*.csproj, Directory.Build.props, global.json, NuGet.Config'

install:
  - ps: choco install dotnet-10.0-sdk --no-progress -y
  - dotnet --info

before_build:
  - dotnet restore SmtpEmailService.sln

build_script:
  - dotnet build SmtpEmailService.sln --configuration Release --no-restore

test_script:
  - dotnet test SmtpEmailService.sln --configuration Release --no-build --no-restore --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

after_test:
  - ps: Get-ChildItem -Path TestResults -Filter *.trx -Recurse | ForEach-Object { Push-AppveyorArtifact $_.FullName -FileName $_.Name }

artifacts:
  - path: TestResults\*.trx
    name: TestResults
