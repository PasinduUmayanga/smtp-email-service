version: 1.0.{build}

image: Visual Studio 2022

environment:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_PACKAGES: '%USERPROFILE%\.nuget\packages'

cache:
  - '%NUGET_PACKAGES%'
  - '%LOCALAPPDATA%\NuGet\v3-cache'
  - '.dotnet -> global.json'

install:
  - ps: |
      $dotnetDirectory = Join-Path $env:APPVEYOR_BUILD_FOLDER '.dotnet'
      $dotnetExecutable = Join-Path $dotnetDirectory 'dotnet.exe'
      $sdkDirectory = Join-Path $dotnetDirectory 'sdk\10.0.400'
      if (-not (Test-Path -LiteralPath $sdkDirectory)) {
        Invoke-WebRequest 'https://dot.net/v1/dotnet-install.ps1' -OutFile dotnet-install.ps1
        & .\dotnet-install.ps1 -Version 10.0.400 -InstallDir $dotnetDirectory -NoPath
      }
      & $dotnetExecutable --info

before_build:
  - ps: & .\.dotnet\dotnet.exe restore SmtpEmailService.sln

build_script:
  - ps: & .\.dotnet\dotnet.exe build SmtpEmailService.sln --configuration Release --no-restore

test_script:
  - ps: & .\.dotnet\dotnet.exe test SmtpEmailService.sln --configuration Release --no-build --no-restore --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

after_test:
  - ps: Get-ChildItem -Path TestResults -Filter *.trx -Recurse | ForEach-Object { Push-AppveyorArtifact $_.FullName -FileName $_.Name }

artifacts:
  - path: TestResults\*.trx
    name: TestResults
